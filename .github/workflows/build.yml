name: Cloud Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21' # تم رفع الإصدار إلى 21 لحل مشكلة التجميع

      - name: Set up NodeJS Engine
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and Build App File
        working-directory: "Web Apps/Timer App"
        run: |
          npm install

          # منح صلاحيات التشغيل للأدوات
          chmod -R +x node_modules/.bin

          # إجراء مزامنة الكاباسيتور
          npx cap sync android

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Asset to Actions Timeline
        uses: actions/upload-artifact@v4
        with:
          name: Timer App 
          path: "Web Apps/Timer App/android/app/build/outputs/apk/debug/app-debug.apk"