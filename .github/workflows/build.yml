name: Cloud Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Environment
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up NodeJS Engine
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and Build App File
        working-directory: "Web Apps/Timer App"
        run: |
          npm install
          
          # Force execution parameters by explicitly calling the package module
          npx --package=@capacitor/cli cap sync
          
          cd android
          # Grants the server strict execution permissions to compile the final Android project files
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Asset to Actions Timeline
        uses: actions/upload-artifact@v4
        with:
          name: Timer App 
          path: "Web Apps/Timer App/android/app/build/outputs/apk/debug/app-debug.apk"
