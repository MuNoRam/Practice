name: Cloud Android Build

# This opens up manual push triggers on the website dashboard
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up NodeJS Engine
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install and Build App File
        run: |
          cd Web Apps/Timer App
          npm install
          npx cap sync
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Asset to Actions Timeline
        uses: actions/upload-artifact@v4
        with:
          name: ChessClockAPK
          path: web-apps/timer-app/android/app/build/outputs/apk/debug/app-debug.apk
