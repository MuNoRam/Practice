name: Cloud Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        # تم التحديث لدعم أحدث بيئات العقدة
        uses: actions/checkout@v4.2.2 

      - name: Set up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up NodeJS Engine
        # تم التحديث لإصدار يتوافق تلقائياً مع بيئات Node الحديثة
        uses: actions/setup-node@v4.1.0 
        with:
          node-version: '22'

      - name: Install and Build App File
        working-directory: "Web Apps/Timer App"
        run: |
          npm install

          # منح صلاحيات التشغيل
          chmod -R +x node_modules/.bin

          # مزامنة الكاباسيتور
          npx cap sync android

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Asset to Actions Timeline
        uses: actions/upload-artifact@v4.4.3
        with:
          name: Timer App 
          path: "Web Apps/Timer App/android/app/build/outputs/apk/debug/app-debug.apk"