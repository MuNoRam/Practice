name: Cloud Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up NodeJS Engine
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies and Generate Assets
        working-directory: "Web Apps/Timer App"
        run: |
          npm install
          # تثبيت أداة الأصول وتوليد الأيقونات داخل بيئة GitHub السريعة
          npm install -D @capacitor/assets
          npx @capacitor/assets generate --android

          # منح صلاحيات التشغيل ومزامنة أندرويد
          chmod -R +x node_modules/.bin
          npx cap sync android

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # حفظ الملف كـ Artifact
      - name: Upload APK Asset to Actions Timeline
        uses: actions/upload-artifact@v4
        with:
          name: Timer App 
          path: "Web Apps/Timer App/android/app/build/outputs/apk/debug/app-debug.apk"

      # رفع ملف الـ APK إلى قسم Releases
      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Release v1.0.${{ github.run_number }}"
          draft: false
          prerelease: false
          files: "Web Apps/Timer App/android/app/build/outputs/apk/debug/app-debug.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}